                <div className="flex items-center gap-2 mb-3">
                  <span className="h-px w-6 bg-white/40" />
                  <span className="text-[10px] uppercase tracking-[0.24em] text-white/75 font-medium">get in touch</span>
                </div>
                <h3 className="text-white font-medium mb-4" style={{ fontSize: "clamp(20px, 1.7vw, 28px)", letterSpacing: "-0.02em", lineHeight: 1.1 }}>
                  Send me a{" "}
                  <span
                    className="italic font-normal"
                    style={{ fontFamily: "'Instrument Serif', 'Times New Roman', serif" }}
                  >
                    message
                  </span>
                </h3>
                <form onSubmit={onSubmit} className="flex flex-col gap-2.5">
                  <input
                    className="contact-input compact"
                    type="text"
                    placeholder="Your name"
                    value={form.name}
                    onChange={onChange("name")}
                    required
                  />
                  <input
                    className="contact-input compact"
                    type="email"
                    placeholder="Your email"
                    value={form.email}
                    onChange={onChange("email")}
                    required
                  />
                  <textarea
                    className="contact-textarea compact"
                    placeholder="What are you working on?"
                    value={form.message}
                    onChange={onChange("message")}
                    required
                  />
                  <div className="flex items-center justify-between gap-3 mt-1">
                    <span className="text-[10.5px] text-white/50 leading-tight">
                      {sent ? "Opening your email…" : "Replies within 24 hours."}
                    </span>
                    <button
                      type="submit"
                      className="group inline-flex items-center gap-1.5 bg-white text-black text-[12.5px] font-medium rounded-full pl-3.5 pr-1 py-1 hover:bg-neutral-200 transition-colors"
                    >
                      <span>Send</span>
                      <span className="flex items-center justify-center w-6 h-6 rounded-full bg-black text-white group-hover:translate-x-0.5 transition-transform">
                        <svg viewBox="0 0 24 24" className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                      </span>
                    </button>
                  </div>
                </form>
              </div>

              <div className="mt-5 flex items-center justify-between text-[10.5px] text-white/55">
                <div className="flex items-center gap-1.5">
                  <Logo className="h-3 w-3" />
                  <span>kirkvidkodre.com</span>
                </div>
                <div>© {new Date().getFullYear()} Kirk Vid Kodre</div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    const App = () => (
      <React.Fragment>
        <Hero />
        <WorkSection />
        <div className="seam-blender" />
        <CTASection />
      </React.Fragment>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
